<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="./src/style.css" />
		<link rel="stylesheet" href="./src/fonts.css" />
		<script src="./src/script.js" defer></script>
		<title>Library</title>
		<link rel="shortcut icon" href="./src/books.svg" type="image/svg" />

		<!-- Google Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Blinker:wght@100;200;300;400;600;700;800;900&family=Play:wght@400;700&family=Thasadith:ital,wght@0,400;0,700;1,400;1,700&family=Ubuntu+Condensed&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Baumans&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<header class="play-bold font">
			<div>
				<div>
					<img src="./src/books.svg" alt="books icon" />My Little
					Library
				</div>
				<div>
					<button
						type="button"
						commandfor="new-book-modal"
						command="show-modal"
					>
						+
					</button>
				</div>
			</div>
		</header>
		<div class="container"></div>
		<dialog closedby="any" id="new-book-modal">
			<form action="#" method="dialog" class="blinker-light font">
				<h2 id="add-new-book-heading">Add New Book</h2>
				<h2 id="edit-book-heading">Edit Book</h2>
				<button
					type="button"
					commandfor="new-book-modal"
					command="close"
					class="close-modal"
					aria-label="close modal"
				>
					×
				</button>
				<div>
					<label for="book-title">Book Title</label>
					<input
						type="text"
						name="book-title"
						id="book-title"
						required
						placeholder="Book"
						class="almarai-bold"
						autofocus
					/>
				</div>
				<div>
					<label for="author">Author</label>
					<input
						type="text"
						name="author"
						id="author"
						required
						placeholder="Author"
						class="almarai-bold"
					/>
				</div>
				<div>
					<label for="pages">Pages</label>
					<input
						type="number"
						name="pages"
						id="pages"
						required
						class="almarai-bold"
					/>
				</div>
				<div>
					<label for="read">Have you read it yet?</label>
					<input type="checkbox" name="read" id="read" value="true" />
				</div>
				<button type="submit" id="add-new-book-btn" class="ubuntu-bold">
					Add
				</button>
				<button type="submit" id="update-book-btn" class="ubuntu-bold">
					Update
				</button>
			</form>
		</dialog>
	</body>
</html>
