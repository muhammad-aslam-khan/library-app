		<dialog closedby="none">
			<form action="" method="get" class="blinker-light font">
				<button class="close-modal" aria-label="close modal">×</button>
				<div>
					<label for="book-title">Book Title</label>
					<input
						type="text"
						name="book-title"
						id="book-title"
						required
						placeholder="Book"
						class="almarai-bold"
					/>
				</div>
				<div>
					<label for="author">Author</label>
					<input
						type="text"
						name="author"
						id="author"
						required
						placeholder="Author"
						class="almarai-bold"
					/>
				</div>
				<div>
					<label for="pages">Pages</label>
					<input
						type="number"
						name="pages"
						id="pages"
						value="200"
						required
						class="almarai-bold"
					/>
				</div>
				<div>
					<label for="read">Have you read it yet?</label>
					<input type="checkbox" name="read" id="read" />
				</div>
				<button type="submit" id="add-new-book" class="ubuntu-bold">
					Add
				</button>
			</form>
		</dialog>
