<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="./css/style.css" />
		<link rel="stylesheet" href="./css/fonts.css" />
		<script src="./script.js" defer></script>
		<title>Library</title>
		<link rel="shortcut icon" href="./images/books.svg" type="image/svg" />

		<!-- Google Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Blinker:wght@100;200;300;400;600;700;800;900&family=Play:wght@400;700&family=Thasadith:ital,wght@0,400;0,700;1,400;1,700&family=Ubuntu+Condensed&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Baumans&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<button class="add-book">Add Book</button>
		<div class="container">
			<div class="book-card blinker-regular font" id="book-1">
				<div>
					<button class="close-btn" aria-label="Remove book">
						×
					</button>
					<div>
						<h3 class="book-title">Book Title</h3>
						<h4 class="author">By Author</h4>
					</div>
					<div><span>Pages</span><span>538</span></div>
					<div>
						<span>Books is read!</span
						><input type="checkbox" name="is-read" id="is-read" />
					</div>
				</div>
				<button class="blinker-regular">Edit</button>
			</div>
		</div>
	</body>
</html>
